name: Backend CI (dev compose + tests)

on:
  push:
    branches: [ dev ]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Generate .env for docker-compose (from GitHub Secrets/Vars)
        run: |
          : > .env
          echo "PROJECT_NAME=${{ vars.PROJECT_NAME || 'time-manager' }}" >> .env
          echo "POSTGRES_VERSION=${{ vars.POSTGRES_VERSION || '18-alpine' }}" >> .env
          echo "POSTGRES_DB=${{ vars.POSTGRES_DB || 'timemanager' }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER || 'tm_user' }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'tm_pass' }}" >> .env
          echo "PORT_DB=${{ vars.PORT_DB || '5432' }}" >> .env
          echo "PYTHON_VERSION=${{ vars.PYTHON_VERSION || '3.12-slim' }}" >> .env
          echo "PORT_BACK=${{ vars.PORT_BACK || '8000' }}" >> .env
          echo "NODE_VERSION=${{ vars.NODE_VERSION || '22.20.0' }}" >> .env
          echo "PORT_FRONT=${{ vars.PORT_FRONT || '5173' }}" >> .env
          echo "NGX_VERSION=${{ vars.NGX_VERSION || '1.29.1' }}" >> .env
          echo "PORT_NGX=${{ vars.PORT_NGX || '8080' }}" >> .env
          echo "CI=1" >> .env
          echo "Generated .env:"
          sed 's/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=***REDACTED***/' .env

      - name: Start database
        run: |
          docker compose -f docker-compose.yml up -d db
          echo "Waiting for Postgres to become healthy..."
          for i in {1..30}; do
            if docker compose -f docker-compose.yml exec -T db pg_isready -U "${{ secrets.POSTGRES_USER || 'tm_user' }}" -d "${{ vars.POSTGRES_DB || 'timemanager' }}" -h localhost; then
              echo "Postgres is ready."
              break
            fi
            sleep 2
          done

      - name: Start backend (dev)
        run: docker compose -f docker-compose.yml up -d backend

      - name: Run backend tests with pytest (inside container)
        run: |
          docker compose -f docker-compose.yml exec -T backend \
            pytest -q \
              --junitxml=/app/junit.xml \
              --cov=/app \
              --cov-report=xml:/app/coverage.xml \
              --cov-report=html:/app/htmlcov

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: backend/junit.xml

      - name: Upload coverage (XML + HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage.xml
            backend/htmlcov

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml down -v
