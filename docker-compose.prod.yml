name: ${PROJECT_NAME}-prod

services:
  db:
    image: "postgres:${POSTGRES_VERSION}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        PORT_BACK: ${PORT_BACK}
    env_file:
      - ./backend/.env.prod
    environment:
      PORT_BACK: ${PORT_BACK}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - staticfiles:/app/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        NODE_VERSION: ${NODE_VERSION_PROD}
    env_file:
      - ./frontend/.env.prod
    networks:
      - internal
    volumes:
      - frontend_dist:/app/dist

  reverseproxy:
    build:
      context: ./reverseProxy
      dockerfile: Dockerfile
      target: prod
      args:
        NGX_VERSION: ${NGX_VERSION}
    environment:
      PORT_FRONT: ${PORT_FRONT}
      PORT_BACK: ${PORT_BACK}
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      - "${PORT_NGX}:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - staticfiles:/var/www/static:ro

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    environment:
      - DOCKER_API_VERSION=1.44
    networks:
      - internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring:/etc/grafana/dashboards:ro
    depends_on:
      - loki
    networks:
      - internal
      - edge
    ports:
      - "${PORT_GRAFANA}:${PORT_GRAFANA}"
    restart: unless-stopped

volumes:
  pgdata:
  frontend_dist:
  staticfiles:
  loki-data:
  grafana-data:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge